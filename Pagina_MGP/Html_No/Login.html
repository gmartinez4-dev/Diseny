<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotoGP Fans | Iniciar sessió</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 min-h-screen bg-[#087CA7] font-sans text-white">

    <main
        class="mx-auto flex w-full max-w-[1920px] flex-col items-center gap-8 px-4 py-8 sm:gap-10 sm:px-5 sm:py-10 lg:flex-row lg:items-start lg:justify-center lg:gap-0 lg:px-0 lg:pt-[80px]">

        <section class="w-full max-w-[613px] text-center lg:mr-[40px] lg:mt-[109px] lg:text-left">

            <img src="../Img/Logotip_Sessio.png" alt="Logo de MotoGP Fans"
                class="mx-auto mb-8 block h-[120px] w-[320px] max-w-full object-contain object-center lg:mx-0 lg:object-left">

            <h1 class="mb-5 text-[30px] font-bold text-[#55C5E9] sm:text-4xl md:text-5xl">
                Benvingut de nou
            </h1>

            <p class="mx-auto max-w-[613px] text-base leading-relaxed text-white lg:mx-0 sm:text-lg">
                Inicia sessió per a disfrutar de totes les funcions
                de MotoGP Fans.
            </p>

        </section>

        <div class="hidden w-[2.5px] self-stretch shrink-0 bg-[#55C5E9] lg:mr-[40px] lg:block" aria-hidden="true">
        </div>

        <section
            class="w-full max-w-[650px] rounded-2xl bg-[#55C5E9] p-5 shadow-xl sm:rounded-[30px] sm:p-8 md:p-10 lg:max-w-[700px] lg:rounded-[35px] lg:px-12 lg:py-10"
            aria-labelledby="titol-login">

            <h2 id="titol-login" class="mb-8 text-center text-2xl font-bold text-[#087CA7] sm:text-3xl">
                Iniciar sessió
            </h2>

            <form class="flex flex-col gap-5 sm:gap-6" action="../Html_Si/Principal_Registrat.html" method="get">

                <div class="flex flex-col gap-2">

                    <label for="usuari" class="font-semibold text-[#064D68]">
                        Nom d'usuari
                    </label>

                    <input id="usuari" name="usuari" type="text" placeholder="Escriu el teu nom d'usuari"
                        autocomplete="username" required
                        class="h-[58px] w-full rounded-xl border-2 border-[#087CA7] bg-[#EAF8FC] px-4 text-base text-[#20242A] outline-none transition placeholder:text-gray-500 focus:border-[#FFB800] focus:ring-2 focus:ring-[#FFB800]/50 sm:h-[64px]">

                </div>

                <div class="flex flex-col gap-2">

                    <label for="contrasenya" class="font-semibold text-[#064D68]">
                        Contrasenya
                    </label>

                    <input id="contrasenya" name="contrasenya" type="password" placeholder="Escriu la teva contrasenya"
                        autocomplete="current-password" required
                        class="h-[58px] w-full rounded-xl border-2 border-[#087CA7] bg-[#EAF8FC] px-4 text-base text-[#20242A] outline-none transition placeholder:text-gray-500 focus:border-[#FFB800] focus:ring-2 focus:ring-[#FFB800]/50 sm:h-[64px]">

                </div>

                <button type="submit"
                    class="mt-2 flex min-h-[66px] w-full items-center justify-center rounded-xl bg-[#FFB800] px-6 py-4 text-lg font-bold text-black transition hover:bg-[#E5A600] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#087CA7] active:scale-[0.99] sm:min-h-[76px]">
                    Iniciar sessió
                </button>

                <div class="text-center">
                    <a href="RecuperarContrasenya.html"
                        class="font-semibold text-[#064D68] underline decoration-2 underline-offset-4 transition hover:text-black">
                        He oblidat la contrasenya
                    </a>
                </div>

                <p class="text-center text-sm text-[#064D68] sm:text-base">
                    Encara no tens un compte?

                    <a href="Registre.html"
                        class="font-bold text-[#064D68] underline decoration-2 underline-offset-4 transition hover:text-black">
                        Registra't
                    </a>
                </p>

            </form>

        </section>

    </main>

</body>

</html>
